name: Clean bundled source

on:
  push:
    paths:
      - '.github/workflows/clean-core.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Strip Luau comments safely
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('SaltyCore.luau')
          s = path.read_text(encoding='utf-8')
          n = len(s)
          out = []
          i = 0
          removed = 0

          def long_open(pos):
              if pos >= n or s[pos] != '[':
                  return None
              j = pos + 1
              while j < n and s[j] == '=':
                  j += 1
              if j < n and s[j] == '[':
                  return j - pos - 1, j + 1
              return None

          while i < n:
              c = s[i]

              if c in ('"', "'", '`'):
                  quote = c
                  out.append(c)
                  i += 1
                  while i < n:
                      ch = s[i]
                      out.append(ch)
                      i += 1
                      if ch == '\\' and i < n:
                          out.append(s[i])
                          i += 1
                          continue
                      if ch == quote:
                          break
                  continue

              lo = long_open(i)
              if lo is not None:
                  eqs, after = lo
                  close = ']' + ('=' * eqs) + ']'
                  end = s.find(close, after)
                  if end == -1:
                      out.append(s[i:])
                      break
                  end += len(close)
                  out.append(s[i:end])
                  i = end
                  continue

              if c == '-' and i + 1 < n and s[i + 1] == '-':
                  comment_start = i
                  i += 2
                  lo = long_open(i)
                  if lo is not None:
                      eqs, after = lo
                      close = ']' + ('=' * eqs) + ']'
                      end = s.find(close, after)
                      if end == -1:
                          comment = s[comment_start:]
                          i = n
                      else:
                          end += len(close)
                          comment = s[comment_start:end]
                          i = end
                      out.append(' ')
                      out.append('\n' * comment.count('\n'))
                      removed += 1
                      continue

                  end = s.find('\n', i)
                  if end == -1:
                      removed += 1
                      break
                  out.append('\n')
                  i = end + 1
                  removed += 1
                  continue

              out.append(c)
              i += 1

          cleaned = ''.join(out)
          if not cleaned.strip():
              raise SystemExit('Refusing to write an empty core')

          path.write_text(cleaned, encoding='utf-8', newline='\n')
          print(f'Removed {removed} comments')
          print(f'{len(s)} -> {len(cleaned)} bytes')

      - name: Commit cleaned core
        run: |
          if git diff --quiet -- SaltyCore.luau; then
            echo "No changes"
            exit 0
          fi
          git config user.name "MrRos3"
          git config user.email "114161345+MrRos3@users.noreply.github.com"
          git add SaltyCore.luau
          git commit -m "Clean bundled source"
          git push
