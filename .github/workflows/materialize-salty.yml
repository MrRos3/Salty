name: Materialize Salty

on:
  push:
    paths:
      - ".github/workflows/materialize-salty.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild and verify Salty.luau
        shell: bash
        run: |
          cat .salty-build/part*.b64 | base64 -d | gzip -d > Salty.luau
          test "$(wc -c < Salty.luau)" -eq 468420
          echo "2354b23bd61981e8ca2fae368e9920f09774cd977355d8d02ae265992949dc0a  Salty.luau" | sha256sum -c -

      - name: Commit finished runtime
        shell: bash
        run: |
          rm -rf .salty-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Materialize Salty runtime"
          git push
