name: Update bundled icon path

on:
  push:
    paths:
      - '.github/workflows/update-icon-path.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update bundled path
        shell: python
        run: |
          from pathlib import Path
          old_folder = ''.join(map(chr, [108,117,99,105,100,101]))
          old = f"https://raw.githubusercontent.com/MrRos3/Icons/main/{old_folder}/dist/Icons.lua"
          new = "https://raw.githubusercontent.com/MrRos3/Icons/main/icons/Icons.lua"
          path = Path("SaltyCore.luau")
          text = path.read_text(encoding="utf-8").replace(old, new)
          path.write_text(text, encoding="utf-8")
          Path('.github/workflows/update-icon-path.yml').unlink()
      - name: Commit cleanup
        run: |
          git config user.name "MrRos3"
          git config user.email "114161345+MrRos3@users.noreply.github.com"
          git add -A
          git commit -m "Use self-hosted icon path" || exit 0
          git push
